<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块测试：虚拟手柄与动作控制</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #07101c;
      --panel: #101d31;
      --line: #2b3a55;
    }
    body {
      background: var(--bg);
      font-family: ui-monospace, Consolas, monospace;
    }
    .glass-panel {
      background: rgba(16, 29, 49, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
    }
    .btn-key {
      transition: all 0.08s ease;
      user-select: none;
    }
    .btn-key:active {
      transform: scale(0.92);
      filter: brightness(1.3);
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-6 flex flex-col gap-5">

  <!-- 顶部模块导航栏 -->
  <header class="glass-panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center text-indigo-300">
        <i data-lucide="gamepad-2" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">
          <span>虚拟手柄与动作控制模块</span>
          <span class="text-xs px-2 py-0.5 rounded bg-indigo-900/60 text-indigo-300 border border-indigo-700/50">独立测试</span>
        </h1>
        <p class="text-xs text-slate-400">100% 后台生效，无需窗口焦点，支持 NDS 实体按键与下屏触笔模拟</p>
      </div>
    </div>
    <nav class="flex flex-wrap items-center gap-2 text-xs">
      <a href="/frontend/native-map.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="map" class="w-3.5 h-3.5 text-cyan-400"></i> 🗺️ 3D地图
      </a>
      <a href="/frontend/dialogue-inspector.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="message-square" class="w-3.5 h-3.5 text-purple-400"></i> 💬 对话捕获
      </a>
      <a href="/frontend/controller.html" class="px-3 py-1.5 rounded-lg bg-indigo-600/40 text-indigo-200 border border-indigo-500 flex items-center gap-1.5 font-bold shadow">
        <i data-lucide="gamepad-2" class="w-3.5 h-3.5 text-indigo-300"></i> 🎮 虚拟手柄
      </a>
      <a href="/frontend/navigation.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="navigation" class="w-3.5 h-3.5 text-emerald-400"></i> 🧭 自动寻路
      </a>
      <a href="/frontend/trainer-state.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i> 👤 玩家属性
      </a>
      <a href="/frontend/memory-tracer.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="cpu" class="w-3.5 h-3.5 text-rose-400"></i> 🔍 内存诊断
      </a>
    </nav>
  </header>

  <!-- 主手柄与测试面板 -->
  <main class="grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1">

    <!-- 左侧：NDS 虚拟实体按键 (7 cols) -->
    <div class="lg:col-span-7 space-y-5">
      <div class="glass-panel p-6 rounded-2xl shadow-lg border border-slate-700/60 space-y-6">

        <!-- 顶部肩键 L / R -->
        <div class="flex items-center justify-between px-4">
          <button onclick="pressKey('L')" class="btn-key w-28 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl font-bold text-slate-200 shadow-md active:bg-cyan-600 flex items-center justify-center gap-2">
            <span>[ L ] 键</span>
          </button>
          <div class="text-xs text-slate-500 font-mono">NDS D-Pad & ABXY</div>
          <button onclick="pressKey('R')" class="btn-key w-28 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-xl font-bold text-slate-200 shadow-md active:bg-cyan-600 flex items-center justify-center gap-2">
            <span>[ R ] 键</span>
          </button>
        </div>

        <!-- D-Pad 十字键与 ABXY 动作键 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center py-4 px-2">

          <!-- 十字方向键 D-Pad -->
          <div class="flex flex-col items-center justify-center">
            <div class="relative w-40 h-40">
              <button onclick="pressKey('Up')" class="btn-key absolute top-0 left-12 w-16 h-14 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-t-xl flex items-center justify-center shadow-lg active:bg-cyan-600">
                <i data-lucide="chevron-up" class="w-7 h-7 text-slate-200"></i>
              </button>
              <button onclick="pressKey('Left')" class="btn-key absolute top-12 left-0 w-14 h-16 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-l-xl flex items-center justify-center shadow-lg active:bg-cyan-600">
                <i data-lucide="chevron-left" class="w-7 h-7 text-slate-200"></i>
              </button>
              <div class="absolute top-12 left-12 w-16 h-16 bg-slate-900 border border-slate-800 flex items-center justify-center">
                <div class="w-4 h-4 rounded-full bg-slate-700"></div>
              </div>
              <button onclick="pressKey('Right')" class="btn-key absolute top-12 right-0 w-14 h-16 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-r-xl flex items-center justify-center shadow-lg active:bg-cyan-600">
                <i data-lucide="chevron-right" class="w-7 h-7 text-slate-200"></i>
              </button>
              <button onclick="pressKey('Down')" class="btn-key absolute bottom-0 left-12 w-16 h-14 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-b-xl flex items-center justify-center shadow-lg active:bg-cyan-600">
                <i data-lucide="chevron-down" class="w-7 h-7 text-slate-200"></i>
              </button>
            </div>
            <div class="text-[11px] text-slate-500 font-mono mt-3">十字方向键 (D-Pad)</div>
          </div>

          <!-- ABXY 动作按键 -->
          <div class="flex flex-col items-center justify-center">
            <div class="relative w-40 h-40">
              <button onclick="pressKey('X')" class="btn-key absolute top-0 left-12 w-14 h-14 bg-amber-600/30 hover:bg-amber-600/50 border border-amber-500/50 rounded-full font-bold text-amber-200 text-lg shadow-lg active:bg-amber-500 flex items-center justify-center">
                X
              </button>
              <button onclick="pressKey('Y')" class="btn-key absolute top-12 left-0 w-14 h-14 bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500/50 rounded-full font-bold text-emerald-200 text-lg shadow-lg active:bg-emerald-500 flex items-center justify-center">
                Y
              </button>
              <button onclick="pressKey('A')" class="btn-key absolute top-12 right-0 w-14 h-14 bg-rose-600/30 hover:bg-rose-600/50 border border-rose-500/50 rounded-full font-bold text-rose-200 text-lg shadow-lg active:bg-rose-500 flex items-center justify-center">
                A
              </button>
              <button onclick="pressKey('B')" class="btn-key absolute bottom-0 left-12 w-14 h-14 bg-cyan-600/30 hover:bg-cyan-600/50 border border-cyan-500/50 rounded-full font-bold text-cyan-200 text-lg shadow-lg active:bg-cyan-500 flex items-center justify-center">
                B
              </button>
            </div>
            <div class="text-[11px] text-slate-500 font-mono mt-3">动作按键 (A:确认 / B:取消 / X:菜单 / Y:快捷)</div>
          </div>

        </div>

        <!-- 底部功能键 Start / Select -->
        <div class="flex items-center justify-center gap-10 pt-2 border-t border-slate-800/80">
          <button onclick="pressKey('Select')" class="btn-key px-6 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-full text-xs font-semibold text-slate-300 shadow active:bg-cyan-600">
            SELECT
          </button>
          <button onclick="pressKey('Start')" class="btn-key px-6 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-full text-xs font-semibold text-slate-300 shadow active:bg-cyan-600">
            START
          </button>
        </div>

      </div>

      <!-- 快速宏指令与测试工具 -->
      <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-3">
        <div class="text-xs font-bold text-slate-300 flex items-center gap-2">
          <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i>
          <span>常用快速宏操作:</span>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 text-xs">
          <button onclick="pressCombo(['B', 'Right'], 8)" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium transition">
            🏃 向右快跑 (B+→)
          </button>
          <button onclick="pressCombo(['B', 'Left'], 8)" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium transition">
            🏃 向左快跑 (B+←)
          </button>
          <button onclick="pressCombo(['B', 'Up'], 8)" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium transition">
            🏃 向上快跑 (B+↑)
          </button>
          <button onclick="pressCombo(['B', 'Down'], 8)" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium transition">
            🏃 向下快跑 (B+↓)
          </button>
        </div>
      </div>
    </div>

    <!-- 右侧：下屏触控板与按键执行日志 (5 cols) -->
    <div class="lg:col-span-5 space-y-5">

      <!-- NDS 虚拟触摸屏 (Touch Screen) -->
      <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs font-bold text-slate-200">
            <i data-lucide="touchpad" class="w-4 h-4 text-cyan-400"></i>
            <span>NDS 虚拟触控板 (256 × 192)</span>
          </div>
          <span id="touchCoordBadge" class="text-[11px] font-mono text-cyan-300">X: 128, Y: 96</span>
        </div>

        <div id="touchPad" class="relative w-full h-48 bg-slate-950 rounded-xl border border-slate-800 cursor-crosshair flex items-center justify-center overflow-hidden shadow-inner select-none">
          <div class="text-slate-600 text-xs pointer-events-none text-center space-y-1">
            <i data-lucide="mouse-pointer-click" class="w-6 h-6 mx-auto text-slate-700 mb-1"></i>
            <div>在此区域点击以模拟触笔触摸</div>
            <div class="text-[10px] text-slate-700">自动发送 Touch (X, Y) 到游戏</div>
          </div>
          <div id="touchIndicator" class="absolute w-5 h-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-cyan-400 bg-cyan-400/30 hidden pointer-events-none animate-ping"></div>
        </div>
      </div>

      <!-- 按键执行与 RAM 响应日志 -->
      <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-3 flex flex-col h-[300px]">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs font-bold text-slate-200">
            <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>
            <span>按键执行与返回日志</span>
          </div>
          <button onclick="clearLogs()" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700">清空</button>
        </div>

        <div id="logList" class="flex-1 overflow-y-auto space-y-1.5 text-xs font-mono pr-1">
          <div class="p-2 rounded bg-slate-950/70 border border-slate-800/80 text-slate-500 text-center">
            按下按键或点击触控屏后将在此显示执行耗时与返回数据
          </div>
        </div>
      </div>

    </div>

  </main>

  <script>
    lucide.createIcons();
    const API_BASE = window.location.origin;
    const logList = document.getElementById('logList');

    function appendLog(msg, type = 'info') {
      const timeStr = new Date().toTimeString().split(' ')[0];
      const div = document.createElement('div');
      div.className = `p-2 rounded bg-slate-950/80 border ${type === 'err' ? 'border-rose-900 text-rose-300' : 'border-slate-800 text-slate-300'} flex items-center justify-between gap-2`;
      div.innerHTML = `<span>${msg}</span><span class="text-[10px] text-slate-500">${timeStr}</span>`;
      logList.prepend(div);
    }

    function clearLogs() {
      logList.innerHTML = '<div class="p-2 rounded bg-slate-950/70 border border-slate-800 text-slate-500 text-center">日志已清空</div>';
    }

    async function pressKey(button) {
      try {
        const res = await fetch(`${API_BASE}/api/actions/press`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ button, frames: 4 })
        }).then(r => r.json());
        appendLog(`🎮 按键 [${button}] -> 成功发送`);
      } catch (e) {
        appendLog(`❌ 按键 [${button}] 失败: ${e}`, 'err');
      }
    }

    async function pressCombo(buttons, frames = 8) {
      try {
        const res = await fetch(`${API_BASE}/api/actions/press`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ buttons, frames })
        }).then(r => r.json());
        appendLog(`⚡ 组合键 [${buttons.join('+')}] -> 成功发送`);
      } catch (e) {
        appendLog(`❌ 组合键失败: ${e}`, 'err');
      }
    }

    // Touch Pad interaction
    const pad = document.getElementById('touchPad');
    const indicator = document.getElementById('touchIndicator');
    const coordBadge = document.getElementById('touchCoordBadge');

    pad.addEventListener('click', async (e) => {
      const rect = pad.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Scale to NDS touchscreen 256x192
      const ndsX = Math.round((clickX / rect.width) * 256);
      const ndsY = Math.round((clickY / rect.height) * 192);

      coordBadge.innerText = `X: ${ndsX}, Y: ${ndsY}`;

      // Visual indicator
      indicator.style.left = `${clickX}px`;
      indicator.style.top = `${clickY}px`;
      indicator.classList.remove('hidden');
      setTimeout(() => indicator.classList.add('hidden'), 400);

      try {
        await fetch(`${API_BASE}/api/actions/touch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x: ndsX, y: ndsY, frames: 4 })
        });
        appendLog(`👆 触屏触摸 (X: ${ndsX}, Y: ${ndsY}) -> 成功发送`);
      } catch (err) {
        appendLog(`❌ 触屏触摸失败: ${err}`, 'err');
      }
    });
  </script>
</body>
</html>
