<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Console · Pokémon Black 2</title><link rel="stylesheet" href="/frontend/ui/runtime.css"><script src="/frontend/ui/runtime-client.js" defer></script><style>.pad{display:grid;grid-template-columns:70px 70px 70px;grid-template-rows:70px 70px 70px;gap:7px;justify-content:center}.pad .btn{font-size:20px}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}.pad .mid{grid-column:2;grid-row:2;display:grid;place-items:center;color:var(--quiet);font:10px monospace}</style></head>
<body><div class="shell"><div data-runtime-shell></div><main class="page"><section class="page-head"><div><div class="eyebrow">Input Domain</div><h1>虚拟手柄与输入控制</h1><p class="page-desc">这里只负责向 BizHawk 发送按键，不自行判断人物状态、碰撞或剧情结果。输入后的事实变化由 Player / Dialogue / World 模块读取。</p></div></section><div class="layout-main"><section class="card"><div class="card-head"><div><div class="card-title">D-Pad</div><div class="card-sub">默认 4 frames；跑步可组合 B + 方向</div></div></div><div class="card-body"><div class="pad"><button class="btn up" data-btn="Up">↑</button><button class="btn left" data-btn="Left">←</button><div class="mid">D-PAD</div><button class="btn right" data-btn="Right">→</button><button class="btn down" data-btn="Down">↓</button></div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn primary" data-btn="A">A</button><button class="btn" data-btn="B">B</button><button class="btn" data-btn="X">X</button><button class="btn" data-btn="Y">Y</button><button class="btn" data-btn="Start">Start</button><button class="btn" data-btn="Select">Select</button></div></div></section><aside class="grid"><section class="card"><div class="card-head"><div class="card-title">Input Result</div></div><div class="card-body"><pre id="result" class="code">等待输入</pre></div></section><section class="card"><div class="card-head"><div class="card-title">观察结果</div></div><div class="card-body module-links"><a class="module-link" href="/frontend/player-state.html"><strong>Player</strong><span>确认方向与移动结果</span></a><a class="module-link" href="/frontend/dialogue-inspector.html"><strong>Dialogue</strong><span>确认互动/对话结果</span></a><a class="module-link" href="/frontend/map-runtime.html"><strong>World</strong><span>确认门、Warp、地图变化</span></a></div></section></aside></div></main></div><script>window.addEventListener('DOMContentLoaded',()=>{const R=Black2Runtime;R.mountShell('tools');document.querySelectorAll('[data-btn]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const x=await R.jsonFetch('/api/actions/press',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({button:b.dataset.btn,frames:4})},5000);document.getElementById('result').textContent=R.pretty(x)}catch(e){document.getElementById('result').textContent=e.message}finally{b.disabled=false}})});</script></body></html>
