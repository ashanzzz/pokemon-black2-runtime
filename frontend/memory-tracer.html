<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Lab · Pokémon Black 2</title><link rel="stylesheet" href="/frontend/ui/runtime.css"><script src="/frontend/ui/runtime-client.js" defer></script></head><body><div class="shell"><div data-runtime-shell></div><main class="page"><section class="page-head"><div><div class="eyebrow">Forensic Memory Lab</div><h1>内存诊断与只读实验</h1><p class="page-desc">所有工具保持 observation-only。推荐先用 Runtime/Player/World 结构解析；只有未解决字段再回到字节扫描/同帧 batch。</p></div><div class="actions"><a class="btn primary" href="/frontend/ram-dumper.html">完整 RAM Dump</a><a class="btn" href="/frontend/dialogue-checkpoints.html">对话 Checkpoints</a></div></section><div class="layout-main"><div class="grid"><section class="card"><div class="card-head"><div><div class="card-title">Pattern Scan</div><div class="card-sub">输入十六进制字节，例如 00 01 02 FF</div></div></div><div class="card-body"><input id="pattern" value="" placeholder="00 01 02 FF" style="width:100%;background:#07101a;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:7px"><div class="actions" style="margin-top:10px"><button id="scanBtn" class="btn primary">扫描 Main RAM</button></div></div></section><section class="card"><div class="card-head"><div><div class="card-title">Batch Snapshot</div><div class="card-sub">JSON ranges，同一 bridge frame 读取</div></div></div><div class="card-body"><textarea id="ranges" rows="10" style="width:100%;background:#07101a;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:7px;font:11px monospace">[
  {"id":"player_hint","domain":"Main RAM","offset":2311424,"length":64}
]</textarea><div class="actions" style="margin-top:10px"><button id="batchBtn" class="btn">读取同帧 Batch</button></div></div></section></div><aside class="card"><div class="card-head"><div class="card-title">Result</div></div><div class="card-body"><pre id="result" class="code" style="max-height:650px">--</pre></div></aside></div></main></div><script>window.addEventListener('DOMContentLoaded',()=>{const R=Black2Runtime;R.mountShell('tools');const out=x=>document.getElementById('result').textContent=typeof x==='string'?x:R.pretty(x);document.getElementById('scanBtn').onclick=async()=>{try{const bytes=document.getElementById('pattern').value.trim().split(/\s+/).filter(Boolean).map(x=>parseInt(x,16));out(await R.jsonFetch('/api/dev/memory_pattern_scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bytes,start:0,size:4194304,limit:64,domain:'Main RAM'})},15000))}catch(e){out(e.body||e.message)}};document.getElementById('batchBtn').onclick=async()=>{try{const ranges=JSON.parse(document.getElementById('ranges').value);out(await R.jsonFetch('/api/dev/memory_batch_snapshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ranges})},8000))}catch(e){out(e.body||e.message)}}});</script></body></html>
