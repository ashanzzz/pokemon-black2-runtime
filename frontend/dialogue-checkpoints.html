<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dialogue Checkpoints · Pokémon Black 2</title><link rel="stylesheet" href="/frontend/ui/runtime.css"><script src="/frontend/ui/runtime-client.js" defer></script></head><body><div class="shell"><div data-runtime-shell></div><main class="page"><section class="page-head"><div><div class="eyebrow">Controlled RE Experiment</div><h1>对话手工 Checkpoint</h1><p class="page-desc">用于 TextPrinter 生命周期实验。标签只记录操作者看到的阶段，不自动把截图内容当作 parser 输入。</p></div><div class="actions"><a class="btn" href="/frontend/dialogue-inspector.html">实时对话页</a><a class="btn" href="/frontend/ram-dumper.html">完整 RAM Dump</a></div></section><div class="layout-main"><section class="card"><div class="card-head"><div><div class="card-title">Capture Checkpoint</div><div class="card-sub">读取预定义关键内存窗口</div></div></div><div class="card-body"><label class="metric" style="display:block"><span class="metric-label">Label</span><input id="label" value="dialogue_stage" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px"></label><label class="metric" style="display:block;margin-top:8px"><span class="metric-label">Operator note</span><textarea id="note" rows="4" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px"></textarea></label><div class="actions" style="margin-top:12px"><button id="capture" class="btn primary">记录 Checkpoint</button><button id="list" class="btn">刷新历史</button></div><pre id="result" class="code" style="margin-top:12px">--</pre></div></section><aside class="card"><div class="card-head"><div class="card-title">Checkpoint History</div></div><div class="card-body"><div id="history" class="empty">--</div></div></aside></div></main></div><script>window.addEventListener('DOMContentLoaded',()=>{const R=Black2Runtime;R.mountShell('tools');async function list(){try{const x=await R.jsonFetch('/api/dev/dialogue_checkpoint?limit=50');document.getElementById('history').innerHTML=(x.checkpoints||[]).map(c=>`<div class="fact"><div class="fact-key">F ${R.esc(c.frame)}</div><div class="fact-value" style="text-align:left">${R.esc(c.label)}<br><span class="muted">${R.esc(c.operator_note||'')}</span></div></div>`).join('')||'<div class="empty">暂无记录</div>'}catch(e){document.getElementById('history').textContent=e.message}}document.getElementById('capture').onclick=async()=>{try{const x=await R.jsonFetch('/api/dev/dialogue_checkpoint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:document.getElementById('label').value,note:document.getElementById('note').value})},8000);document.getElementById('result').textContent=R.pretty(x);list()}catch(e){document.getElementById('result').textContent=e.body?R.pretty(e.body):e.message}};document.getElementById('list').onclick=list;list()});</script></body></html>
