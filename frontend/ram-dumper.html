<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Dump · Pokémon Black 2</title><link rel="stylesheet" href="/frontend/ui/runtime.css"><script src="/frontend/ui/runtime-client.js" defer></script></head><body><div class="shell"><div data-runtime-shell></div><main class="page"><section class="page-head"><div><div class="eyebrow">Forensic Capture</div><h1>完整运行时证据采集</h1><p class="page-desc">导出 4 MiB Main RAM、屏幕、寄存器和解析上下文。原始 RAM 是同帧物理事实；semantic_state 是紧邻采样的解释层，两者分别标注 frame。</p></div><div class="actions"><button class="btn" id="listBtn">刷新历史</button></div></section><div class="layout-main"><div class="grid"><section class="card"><div class="card-head"><div><div class="card-title">New Evidence Bundle</div><div class="card-sub">只读，不写游戏内存</div></div></div><div class="card-body"><div class="grid cols-2"><label class="metric"><span class="metric-label">Category</span><select id="category" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px"><option>OVERWORLD_EXPLORE</option><option>NPC_INTERACTION</option><option>WARP_TRANSITION</option><option>BATTLE</option><option>MENU</option><option>ANOMALY</option></select></label><label class="metric"><span class="metric-label">Label</span><input id="label" value="ground_truth_sample" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px"></label></div><label class="metric" style="display:block;margin-top:8px"><span class="metric-label">Operator notes</span><textarea id="notes" rows="4" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px" placeholder="只写肉眼可确认事实，例如：面向门，下一次按 Up 会进入建筑"></textarea></label><div class="actions" style="margin-top:12px"><button id="captureBtn" class="btn primary">保存完整快照</button></div></div></section><section class="card"><div class="card-head"><div><div class="card-title">Latest Capture</div><div class="card-sub">main_ram.bin 必须严格 4,194,304 bytes</div></div></div><div class="card-body"><pre id="captureResult" class="code">尚未采集</pre></div></section></div><aside class="card"><div class="card-head"><div><div class="card-title">Evidence History</div><div class="card-sub">存储于 reverse_engineering/dumps</div></div></div><div class="card-body"><div id="history" class="empty">加载中…</div></div></aside></div></main></div><script>
window.addEventListener('DOMContentLoaded',()=>{const R=Black2Runtime;R.mountShell('tools');const esc=R.esc;
 async function list(){try{const x=await R.jsonFetch('/api/dev/dumps?limit=60',{},5000);const arr=x.dumps||[];document.getElementById('history').innerHTML=arr.length?arr.map(d=>`<div class="metric" style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:11px">${esc(d.label||d.folder_name)}</strong><span class="tag ${d.complete?'good':'bad'}">${d.complete?'COMPLETE':'INCOMPLETE'}</span></div><div class="metric-note mono">F ${esc(d.frame)} · RAM ${esc(d.ram_size)} bytes</div><div class="actions" style="margin-top:7px">${d.bundle_url?`<a class="btn" href="${esc(d.bundle_url)}" download>ZIP</a>`:''}${d.manifest_url?`<a class="btn" href="${esc(d.manifest_url)}" target="_blank">manifest</a>`:''}</div></div>`).join(''):'<div class="empty">暂无证据快照</div>'}catch(e){document.getElementById('history').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
 document.getElementById('captureBtn').onclick=async()=>{const b=document.getElementById('captureBtn');b.disabled=true;b.textContent='采集中…';try{const body={category:document.getElementById('category').value,label:document.getElementById('label').value.trim()||'sample',notes:document.getElementById('notes').value.trim()};const x=await R.jsonFetch('/api/dev/dump_full_ram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},30000);document.getElementById('captureResult').textContent=R.pretty(x);await list()}catch(e){document.getElementById('captureResult').textContent=e.body?R.pretty(e.body):e.message}finally{b.disabled=false;b.textContent='保存完整快照'}};document.getElementById('listBtn').onclick=list;list();
});</script></body></html>
