<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navigation Lab · Pokémon Black 2</title><link rel="stylesheet" href="/frontend/ui/runtime.css"><script src="/frontend/ui/runtime-client.js" defer></script></head><body><div class="shell"><div data-runtime-shell></div><main class="page"><section class="page-head"><div><div class="eyebrow">Navigation Lab</div><h1>路径规划实验</h1><p class="page-desc">当前导航服务属于实验层。只有 World 模块验证的坐标/碰撞语义才能升级成可信自动寻路；旧手写 POI 或未经验证 permission byte 不作为 Runtime Truth。</p></div></section><div class="layout-main"><section class="card"><div class="card-head"><div><div class="card-title">Manual Goal</div><div class="card-sub">起点留空时使用当前已验证玩家坐标</div></div></div><div class="card-body"><div class="grid cols-2"><label class="metric"><span class="metric-label">Goal X</span><input id="gx" value="37" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px"></label><label class="metric"><span class="metric-label">Goal Y/Z</span><input id="gy" value="714" style="width:100%;margin-top:7px;background:#07101a;color:var(--text);border:1px solid var(--line);padding:8px;border-radius:6px"></label></div><div class="actions" style="margin-top:12px"><button id="pathBtn" class="btn primary">仅计算路径</button><button id="reachBtn" class="btn">检查可达性</button></div><div class="callout warn" style="margin-top:12px">在碰撞层尚未完成行为验证前，不建议使用“自动执行导航”作为正式功能。先让路径规划保持只读。</div></div></section><aside class="grid"><section class="card"><div class="card-head"><div class="card-title">Result</div></div><div class="card-body"><pre id="result" class="code">--</pre></div></section></aside></div></main></div><script>window.addEventListener('DOMContentLoaded',()=>{const R=Black2Runtime;R.mountShell('tools');const body=()=>({goal_x:Number(document.getElementById('gx').value),goal_y:Number(document.getElementById('gy').value),matrix_id:0,allow_water:false});async function call(url,payload){try{document.getElementById('result').textContent=R.pretty(await R.jsonFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},8000))}catch(e){document.getElementById('result').textContent=e.body?R.pretty(e.body):e.message}}document.getElementById('pathBtn').onclick=()=>call('/api/v1/nav/find_path',body());document.getElementById('reachBtn').onclick=()=>{const x=body();delete x.allow_water;x.mode='walk';call('/api/v1/nav/reachability',x)}});</script></body></html>
