<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块测试：路径规划与自动寻路导航</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #07101c;
      --panel: #101d31;
      --line: #2b3a55;
    }
    body {
      background: var(--bg);
      font-family: ui-monospace, Consolas, monospace;
    }
    .glass-panel {
      background: rgba(16, 29, 49, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-6 flex flex-col gap-5">

  <!-- 顶部模块导航栏 -->
  <header class="glass-panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-600/30 border border-emerald-500/50 flex items-center justify-center text-emerald-300">
        <i data-lucide="navigation" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-100 flex items-center gap-2">
          <span>路径规划与自动寻路导航模块</span>
          <span class="text-xs px-2 py-0.5 rounded bg-emerald-900/60 text-emerald-300 border border-emerald-700/50">独立测试</span>
        </h1>
        <p class="text-xs text-slate-400">基于黑2原生大地图 Matrix、Tile 碰撞层计算 A* 路径与可达性，支持步行动画与奔跑速度</p>
      </div>
    </div>
    <nav class="flex flex-wrap items-center gap-2 text-xs">
      <a href="/frontend/native-map.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="map" class="w-3.5 h-3.5 text-cyan-400"></i> 🗺️ 3D地图
      </a>
      <a href="/frontend/dialogue-inspector.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="message-square" class="w-3.5 h-3.5 text-purple-400"></i> 💬 对话捕获
      </a>
      <a href="/frontend/controller.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="gamepad-2" class="w-3.5 h-3.5 text-indigo-400"></i> 🎮 虚拟手柄
      </a>
      <a href="/frontend/navigation.html" class="px-3 py-1.5 rounded-lg bg-emerald-600/40 text-emerald-200 border border-emerald-500 flex items-center gap-1.5 font-bold shadow">
        <i data-lucide="navigation" class="w-3.5 h-3.5 text-emerald-300"></i> 🧭 自动寻路
      </a>
      <a href="/frontend/trainer-state.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i> 👤 玩家属性
      </a>
      <a href="/frontend/memory-tracer.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
        <i data-lucide="cpu" class="w-3.5 h-3.5 text-rose-400"></i> 🔍 内存诊断
      </a>
    </nav>
  </header>

  <!-- 主内容 -->
  <main class="grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1">

    <!-- 左侧：地标目录与寻路控制器 (6 cols) -->
    <div class="lg:col-span-6 space-y-5">

      <!-- 当前玩家定位 -->
      <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs font-bold text-slate-200">
            <i data-lucide="map-pin" class="w-4 h-4 text-rose-400"></i>
            <span>当前玩家起点定位 (ARM9 RAM)</span>
          </div>
          <span id="playerLocName" class="text-xs font-bold text-indigo-300">读取中...</span>
        </div>
        <div class="grid grid-cols-3 gap-3 text-center text-xs">
          <div class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800">
            <div class="text-[10px] text-slate-500">X 坐标</div>
            <div id="playerX" class="text-sm font-bold text-slate-200 mt-0.5">--</div>
          </div>
          <div class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800">
            <div class="text-[10px] text-slate-500">Y 坐标</div>
            <div id="playerY" class="text-sm font-bold text-slate-200 mt-0.5">--</div>
          </div>
          <div class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800">
            <div class="text-[10px] text-slate-500">当前朝向</div>
            <div id="playerFacing" class="text-sm font-bold text-emerald-400 mt-0.5">--</div>
          </div>
        </div>
      </div>

      <!-- 目标选择与导航执行 -->
      <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-4">
        <div class="text-xs font-bold text-slate-200 flex items-center gap-2">
          <i data-lucide="flag" class="w-4 h-4 text-emerald-400"></i>
          <span>选择目的地或自定义坐标</span>
        </div>

        <div class="space-y-3 text-xs">
          <div>
            <label class="text-slate-400 mb-1 block">预设重要地标 (Catalog POI):</label>
            <select id="landmarkSelect" onchange="onSelectLandmark()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-slate-200 font-sans focus:outline-none focus:border-emerald-500">
              <option value="">-- 选择地标 POI --</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-slate-400 mb-1 block">目标 X 坐标:</label>
              <input id="targetX" type="number" value="16" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-slate-200 font-mono">
            </div>
            <div>
              <label class="text-slate-400 mb-1 block">目标 Y 坐标:</label>
              <input id="targetY" type="number" value="705" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-slate-200 font-mono">
            </div>
          </div>

          <div>
            <label class="text-slate-400 mb-1 block">移动模式:</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setMoveMode('run')" id="modeBtnRun" class="p-2 rounded-xl bg-emerald-600/30 border border-emerald-500 text-emerald-200 font-bold flex items-center justify-center gap-1">
                🏃 奔跑 (B键)
              </button>
              <button onclick="setMoveMode('walk')" id="modeBtnWalk" class="p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center gap-1">
                🚶 步行
              </button>
              <button onclick="setMoveMode('bike')" id="modeBtnBike" class="p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center gap-1">
                🚴 自行车
              </button>
            </div>
          </div>

          <!-- 动作按钮 -->
          <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="testPathfinding()" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold flex items-center justify-center gap-2 transition">
              <i data-lucide="git-branch" class="w-4 h-4 text-cyan-400"></i> 计算 A* 路径
            </button>
            <button onclick="startAutoNavigation()" class="p-3 rounded-xl bg-emerald-600/30 hover:bg-emerald-600/50 border border-emerald-500 text-emerald-200 font-bold flex items-center justify-center gap-2 transition shadow">
              <i data-lucide="play" class="w-4 h-4"></i> 开始自动移动
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- 右侧：路径计算结果与执行状态 (6 cols) -->
    <div class="lg:col-span-6 space-y-5">
      <div class="glass-panel p-5 rounded-2xl shadow-lg border border-slate-700/60 space-y-4 flex flex-col h-full">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs font-bold text-slate-200">
            <i data-lucide="activity" class="w-4 h-4 text-cyan-400"></i>
            <span>寻路状态与实时步进监视</span>
          </div>
          <span id="navStatusBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">空闲</span>
        </div>

        <!-- 路径详情统计 -->
        <div id="pathStats" class="hidden grid grid-cols-3 gap-3 text-center text-xs">
          <div class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800">
            <div class="text-[10px] text-slate-500">预估步数</div>
            <div id="statSteps" class="text-sm font-bold text-cyan-300 mt-0.5">0</div>
          </div>
          <div class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800">
            <div class="text-[10px] text-slate-500">直线距离</div>
            <div id="statDist" class="text-sm font-bold text-slate-200 mt-0.5">0</div>
          </div>
          <div class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800">
            <div class="text-[10px] text-slate-500">可达性判定</div>
            <div id="statReachable" class="text-sm font-bold text-emerald-400 mt-0.5">是</div>
          </div>
        </div>

        <!-- 步骤序列 -->
        <div class="flex-1 flex flex-col space-y-2">
          <div class="text-xs text-slate-400 font-semibold">生成步骤序列:</div>
          <div id="stepsList" class="flex-1 overflow-y-auto max-h-[360px] p-3 rounded-xl bg-slate-950/80 border border-slate-800/80 font-mono text-xs space-y-1 text-slate-300">
            [点击“计算 A* 路径”后将在此显示步骤列表]
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    lucide.createIcons();
    const API_BASE = window.location.origin;
    let moveMode = 'run';
    let landmarks = [];

    function setMoveMode(m) {
      moveMode = m;
      ['run', 'walk', 'bike'].forEach(mode => {
        const btn = document.getElementById(`modeBtn${mode.charAt(0).toUpperCase() + mode.slice(1)}`);
        if (mode === m) {
          btn.className = 'p-2 rounded-xl bg-emerald-600/30 border border-emerald-500 text-emerald-200 font-bold flex items-center justify-center gap-1';
        } else {
          btn.className = 'p-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center gap-1';
        }
      });
    }

    async function loadCatalog() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/nav/catalog`).then(r => r.json());
        landmarks = res.landmarks || [];
        const sel = document.getElementById('landmarkSelect');
        landmarks.forEach((lm, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.innerText = `${lm.name} (X=${lm.x}, Y=${lm.y})`;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error("Load catalog error:", e);
      }
    }

    function onSelectLandmark() {
      const sel = document.getElementById('landmarkSelect');
      if (sel.value !== "") {
        const lm = landmarks[parseInt(sel.value)];
        if (lm) {
          document.getElementById('targetX').value = lm.x;
          document.getElementById('targetY').value = lm.y;
        }
      }
    }

    async function pollPosition() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/map/current`).then(r => r.json());
        const p = res.player || {};
        document.getElementById('playerX').innerText = p.x !== undefined ? p.x : '--';
        document.getElementById('playerY').innerText = p.y !== undefined ? p.y : '--';
        document.getElementById('playerFacing').innerText = p.facing || '--';
        document.getElementById('playerLocName').innerText = res.map_name || '大地图';
      } catch (e) {
        console.error("Poll pos error:", e);
      }
    }

    async function testPathfinding() {
      const gx = parseInt(document.getElementById('targetX').value);
      const gy = parseInt(document.getElementById('targetY').value);
      const badge = document.getElementById('navStatusBadge');
      badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-cyan-900/50 text-cyan-300 border border-cyan-700';
      badge.innerText = '计算中...';

      try {
        const res = await fetch(`${API_BASE}/api/v1/nav/find_path`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal_x: gx, goal_y: gy })
        }).then(r => r.json());

        const steps = res.steps || [];
        const stats = document.getElementById('pathStats');
        const list = document.getElementById('stepsList');

        stats.classList.remove('hidden');
        document.getElementById('statSteps').innerText = steps.length;
        document.getElementById('statDist').innerText = (res.distance || 0).toFixed(1);
        document.getElementById('statReachable').innerText = res.reachable ? '✅ 可到达' : '❌ 阻挡/不可达';

        if (steps.length > 0) {
          badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-emerald-900/50 text-emerald-300 border border-emerald-700';
          badge.innerText = `路径生成完成 (${steps.length} 步)`;
          list.innerHTML = steps.map((s, i) => `
            <div class="p-1.5 rounded bg-slate-900/60 border border-slate-800 flex items-center justify-between">
              <span>第 ${i + 1} 步: 按下 [${s}]</span>
            </div>
          `).join('');
        } else {
          badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-rose-900/50 text-rose-300 border border-rose-700';
          badge.innerText = '未找到可行路径';
          list.innerHTML = '<div class="text-rose-400 p-2">未找到从当前位置到目标的可行路径（可能存在碰撞阻挡或跨地图）</div>';
        }
      } catch (e) {
        badge.innerText = '计算出错';
      }
    }

    async function startAutoNavigation() {
      const gx = parseInt(document.getElementById('targetX').value);
      const gy = parseInt(document.getElementById('targetY').value);
      const badge = document.getElementById('navStatusBadge');
      badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold animate-pulse';
      badge.innerText = '正在自动移动...';

      try {
        const res = await fetch(`${API_BASE}/api/v1/nav/navigate_to`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal_x: gx, goal_y: gy, mode: moveMode, max_steps: 100 })
        }).then(r => r.json());

        if (res.status === 'interrupted_by_dialogue') {
          badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-purple-900/50 text-purple-300 border border-purple-700 font-bold';
          badge.innerText = `遇到剧情对话中断 (已走 ${res.executed_steps} 步)`;
        } else if (res.status === 'completed') {
          badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-emerald-900/50 text-emerald-300 border border-emerald-700 font-bold';
          badge.innerText = `已到达目标位置 (共 ${res.executed_steps} 步)`;
        }
      } catch (e) {
        badge.innerText = '导航执行异常';
      }
    }

    loadCatalog();
    setInterval(pollPosition, 400);
    pollPosition();
  </script>
</body>
</html>
