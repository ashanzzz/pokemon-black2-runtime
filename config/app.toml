[web]
host = "127.0.0.1"
port = 8765
role = "FastAPI + browser UI only"

[bridge]
host = "127.0.0.1"
port = 8766
role = "BizHawk Lua TCP bridge only"

[runtime]
semantic_sample_interval_seconds = 0.20
map_scene_cache_seconds = 3.0

[frontend]
api_mode = "same-origin-relative"
# Browser pages must never hard-code 127.0.0.1:8765.
# Transport health and semantic decode health are displayed separately.
